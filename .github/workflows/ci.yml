name: CI

on:
  pull_request: 
    branches:
      - main
    
env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs: 
  Csharp-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{env.DOTNET_VERSION}}
  
      - name: restore dependencies
        run: dotnet restore UtahProject.slnx
        
      - name: Audit nuget packages
        run: dotnet list package --vulnerable --include-transitive
        
      - name: enforce code formatting
        run: dotnet format UtahProject.slnx --verify-no-changes --severity warn

      - name: build
        run: dotnet build UtahProject.slnx -c Release --no-restore -warnaserror